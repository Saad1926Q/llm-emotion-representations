[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-emotion-representations"
version = "0.1.0"
description = "Generation-based emotion representation experiments for language models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "transformers>=5.18.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/emotion_vectors"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
